<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Steel &amp; Steam</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; }
    body { width: 280px; margin: 0; padding: 20px; background: #17232a; color: #edf3ed; }
    h1 { font-size: 19px; margin: 0 0 12px; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 10px; font: inherit; font-weight: 700; background: #f0c070; color: #17232a; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    p { margin: 12px 0 0; }
    #status { min-height: 42px; }
    .controls { color: #b9cbd0; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Steel &amp; Steam</h1>
  <button id="toggle" type="button" disabled>Start platforming</button>
  <p id="status" role="status" aria-live="polite">Checking this page…</p>
  <p class="controls">Move: A / D or ← / →<br>Jump: Space / W / ↑<br>Drop through: S / ↓<br>B: geometry debug · Escape: stop</p>
  <p class="controls">Works on ordinary HTTP and HTTPS pages. Reload this popup after stopping with Escape.</p>
  <script src="popup.js"></script>
</body>
</html>
